name: Sandbox Preview per PR
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
      - name: Deploy to sandbox host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SANDBOX_HOST }}
          key: ${{ secrets.SANDBOX_SSH_KEY }}
          script: |
            cd /opt/preview/pr-${{ github.event.pull_request.number }}
            echo "IMAGE=ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}-${{ github.sha }}" > .env
            docker compose up -d --force-recreate
      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            🚀 **Preview ready:** https://pr-${{ github.event.pull_request.number }}.preview.yourdomain.com
            Commit: `${{ github.sha }}`
  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Tear down preview
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SANDBOX_HOST }}
          key: ${{ secrets.SANDBOX_SSH_KEY }}
          script: docker compose -f /opt/preview/pr-${{ github.event.pull_request.number }}/docker-compose.yml down -v || true
