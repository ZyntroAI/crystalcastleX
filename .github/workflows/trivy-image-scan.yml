name: Trivy Image Scan

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read
  security-events: write   # ✅ Required for CodeQL upload
  actions: read

jobs:
  scan:
    name: 🛡️ Trivy Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local:scan

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        id: trivy-scan
        with:
          image-ref: local:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload results to GitHub (CodeQL v4)
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-image-scan
