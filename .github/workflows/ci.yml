name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d275971dd929545 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0a5c6159c62f486d473e972c4d56b43f478c53c # v5.1.0
        with:
          python-version: "3.12"
          cache: "pip"
