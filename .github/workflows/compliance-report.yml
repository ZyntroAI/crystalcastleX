name: Unified Compliance Report

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: compliance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compliance-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare compliance data dir
        run: |
          mkdir -p frontend
          for file in license-status.json pr-status.json issue-status.json deploy-status.json ai-key-status.json; do
            if [ ! -f "frontend/$file" ]; then
              echo "{\"_generated\": \"fallback\", \"_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > "frontend/$file"
            fi
          done
          echo "🔍 Collecting compliance data..."
          ls -lh frontend/*.json || true

      - name: Post / Update PR compliance comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const safeRead = (p, fallback = {}) => {
              try {
                const full = path.join('frontend', p);
                if (!fs.existsSync(full)) return fallback;
                const raw = fs.readFileSync(full, 'utf8').trim();
                if (!raw) return fallback;
                return JSON.parse(raw);
              } catch (e) {
                console.log(`Failed to parse ${p}: ${e.message}`);
                return { _error: e.message, ...fallback };
              }
            };

            const license = safeRead('license-status.json', {});
            const prs = safeRead('pr-status.json', []);
            const issues = safeRead('issue-status.json', []);
            const deploy = safeRead('deploy-status.json', {});
            const keys = safeRead('ai-key-status.json', {});

            const prList = Array.isArray(prs) ? prs : [prs];
            const issueList = Array.isArray(issues) ? issues : [issues];

            const getBadge = (status) => {
              if (!status) return '❓ unknown';
              const s = String(status).toLowerCase();
              if (['valid','ok','active','pass','present'].includes(s)) return `✅ ${status}`;
              if (['missing','invalid','fail','expired'].includes(s)) return `❌ ${status}`;
              return `⚠️ ${status}`;
            };

            let comment = `## 🛡️ Governance Compliance Report\n`;
            comment += `> Commit: \`${context.sha.substring(0,7)}\` | Generated: ${new Date().toISOString()}\n\n`;

            comment += `### 📜 License Status\n`;
            comment += `| File | Status |\n|---|---|\n`;
            comment += `| Root LICENSE | ${getBadge(license.root?.status)} |\n`;
            comment += `| Frontend LICENSE | ${getBadge(license.frontend?.status)} |\n`;
            comment += `| Docs/license/LICENSE | ${getBadge(license.docs?.status)} |\n`;
            comment += `| Notuse/LICENSE | ${getBadge(license.archive?.status)} |\n\n`;

            comment += `### 🔍 PR Severity (${prList.length})\n`;
            if (prList.length) {
              prList.forEach(pr => { comment += `- PR #${pr.id || '?'}: ${pr.title || 'N/A'} → **${pr.severity || 'unknown'}**\n`; });
            } else { comment += `_No PR data_\n`; }
            comment += `\n`;

            comment += `### 📝 Issue Severity (${issueList.length})\n`;
            if (issueList.length) {
              issueList.forEach(issue => { comment += `- Issue #${issue.id || '?'}: ${issue.title || 'N/A'} → **${issue.severity || 'unknown'}**\n`; });
            } else { comment += `_No Issue data_\n`; }
            comment += `\n`;

            comment += `### 🚀 Deployment Status\n`;
            comment += `- Branch: \`${deploy.branch || context.payload.pull_request?.head?.ref || 'unknown'}\`\n`;
            comment += `- URL: ${deploy.url ? `[${deploy.url}](${deploy.url})` : 'N/A'}\n`;
            comment += `- Cache: ${deploy.cache?.status || 'unknown'} (${deploy.cache?.size || 'N/A'}, last used ${deploy.cache?.last_used || 'N/A'})\n\n`;

            comment += `### 🔑 AI Key Context\n`;
            comment += `| Key | Status | Last Rotated |\n|---|---|---|\n`;
            comment += `| DevKey | ${getBadge(keys.dev?.status)} | ${keys.dev?.last_rotated || 'N/A'} |\n`;
            comment += `| FallbackKey | ${getBadge(keys.fallback?.status)} | ${keys.fallback?.last_rotated || 'N/A'} |\n`;
            comment += `| PrdKey | ${getBadge(keys.prd?.status)} | ${keys.prd?.last_rotated || 'N/A'} |\n`;

            // Also add to Job Summary
            await core.summary.addRaw(comment).write();

            // Upsert logic - update existing comment instead of spamming
            const marker = "<!-- compliance-report -->";
            const bodyWithMarker = marker + "\n" + comment;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: bodyWithMarker
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: bodyWithMarker
              });
            }