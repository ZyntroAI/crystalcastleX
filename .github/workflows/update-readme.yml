name: 📝 Update README from docs/knowledge

on:
  push:
    branches: [main]
    paths:
      - 'docs/knowledge/**'
      - 'scripts/update_readme.py'
  pull_request:                       # ← เพิ่ม: dry-run + แสดง diff ก่อน merge
    paths: ['docs/knowledge/**', 'scripts/update_readme.py']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'              # ← 03:17 UTC (off-peak)

concurrency:                            # ← เพิ่ม: ป้องกันรันซ้อน
  group: update-readme-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write                  # ← เพิ่มสำหรับสร้าง PR

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5       # TODO: pin เป็น 40-char SHA ตาม SECURITY.md
        with:
          fetch-depth: 1                # ← ไม่ต้อง full history

      - name: 🚨 Fail fast (ไม่ mask ปัญหา)
        run: |
          if [ -f "docs/knowledge" ]; then
            echo "::error::docs/knowledge เป็นไฟล์ ไม่ใช่ไดเรกทอรี — กรุณาแก้ใน repo ด้วยมือ ไม่แก้ใน CI"
            exit 1
          fi
          mkdir -p docs/knowledge

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5   # TODO: pin SHA
        with:
          python-version: '3.12'        # ← 3.11 เก่าแล้ว

      - name: 📦 Install dependencies (pin version)
        run: pip install --no-cache-dir pyyaml==6.0.2
        # หรือถ้ามีหลายตัว: pip install -r scripts/requirements.txt

      - name: 🚀 Run README sync
        run: python scripts/update_readme.py

      # ── ถ้าเป็น PR: แสดง diff เป็น comment ไม่ commit ──
      - name: 💬 Post README diff บน PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7   # TODO: pin SHA
        with:
          script: |
            const { execSync } = require('child_process');
            const diff = execSync('git diff README.md').toString();
            const body = diff
              ? `### 📝 README จะเปลี่ยนแปลงดังนี้\n\`\`\`diff\n${diff.slice(0, 30000)}\n\`\`\``
              : '✅ README ไม่เปลี่ยนแปลง';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });

      # ── ถ้าไม่ใช่ PR: สร้าง PR อัตโนมัติ (ใช้ได้แม้ main protected) ──
      - name: 🔀 Create Pull Request (ถ้ามีการเปลี่ยนแปลง)
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7   # TODO: pin SHA
        with:
          commit-message: "docs: auto-sync knowledge → README [skip ci]"
          title: "📝 docs: auto-sync knowledge → README"
          body: |
            Auto-generated by `update-readme.yml`
            - ไฟล์ต้นทาง: `docs/knowledge/**`
            - สคริปต์: `scripts/update_readme.py`
            - Merge ได้เลยถ้า CI ผ่าน (หรือเปิด auto-merge)
          branch: bot/update-readme
          delete-branch: true
          labels: documentation, auto-merge
          add-paths: ["README.md"]      # commit แค่ README.md เท่านั้น

      - name: 🔔 แจ้งเตือนเมื่อล้มเหลว
        if: failure()
        run: |
          echo "::error::README sync failed — ดู log ข้างบน"
          # เพิ่ม Slack webhook / gh issue create ที่นี่ถ้าต้องการ
