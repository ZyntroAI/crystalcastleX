name: 📝 Update README from docs/knowledge

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/knowledge/**'       # Run when knowledge files change
      - 'scripts/update_readme.py' # Run when the script changes
  workflow_dispatch:             # Allow manual trigger
  schedule:
    - cron: '0 0 * * *'          # Daily at midnight UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5 # Upgraded — removes Node 20 deprecation warning
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧹 Fix path conflict & ensure dir exists
        run: |
          # If FILE exists at docs/knowledge → rename it (causes "cannot create directory" error)
          if [ -f "docs/knowledge" ]; then
            echo "⚠️ Found file at docs/knowledge → renaming to docs/knowledge.md"
            mv docs/knowledge docs/knowledge.md
          fi
          
          # Safely create directory tree
          mkdir -p docs/knowledge
          
          echo "✅ Path structure verified"
          ls -la docs/

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speed up dependency install

      - name: 📦 Install dependencies
        run: pip install pyyaml

      - name: 🚀 Run README sync
        run: python scripts/update_readme.py

      - name: ✍️ Commit & push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add README.md
          
          # Exit cleanly if nothing changed
          if git diff --staged --quiet; then
            echo "✅ No README changes detected — nothing to commit"
            exit 0
          fi
          
          git commit -m "docs: auto-sync knowledge → README"
          git push origin main
          echo "🚀 README updated & pushed successfully"
