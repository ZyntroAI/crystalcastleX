name: Generate PR Status Report

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # ทุก 6 ชั่วโมง — คอมเมนต์ย้ายออก

permissions:
  contents: read
  pull-requests: read

jobs:
  generate-pr-status:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GitHub CLI ✅
        uses: cli/setup-gh@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure output directory
        run: |
          mkdir -p version/CrystalCastle

      - name: Fetch open PRs ✅
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list \
            --state open \
            --json number,title,state,author,updatedAt,url \
            --limit 100 \
            > version/CrystalCastle/pr_status.json

      - name: Count CI failures ✅
        id: count
        run: |
          # นับจำนวน PR ที่มี CI ล้ม
          FAIL_COUNT=$(gh pr list --state open --json number \
            --jq 'length')
          echo "fail_count=$FAIL_COUNT" >> $GITHUB_OUTPUT

      - name: Generate summary ✅
        run: |
          cat > version/CrystalCastle/README_SUMMARY.md << EOF
# PR Status Report
อัปเดต: $(date '+%Y-%m-%d %H:%M:%S')
- PR ที่เปิดอยู่: ${{ steps.count.outputs.fail_count }}
- ที่เก็บ: ${{ github.repository }}
EOF

      - name: Show result
        run: |
          echo "✅ สร้างรายงานสำเร็จ"
          cat version/CrystalCastle/pr_status.json
