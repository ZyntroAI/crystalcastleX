version: 2
updates:
  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
  - package-ecosystem: npm
    directory: /
    schedule:
    interval: weekly
 
  - package-ecosystem: github-actions
    directory: /
    schedule:
    interval: weekly
  # Node package (install-crystal action package)
  - package-ecosystem: "npm"
    directory: "/Package"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    groups:
      dev-deps:
        dependency-type: "development"
        update-types: ["patch", "minor"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # Python dependencies (Backend)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Asia/Bangkok"
    labels:
      - "dependencies"
      - "docker"
