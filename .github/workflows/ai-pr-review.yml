name: 🤖 AI PR Review

on:
  pull_request_target:   # ← สำคัญ: ทำงานได้กับ fork PR และมีสิทธิ์ post comment
    types: [opened, synchronize, reopened]
    # paths-ignore: ['**.md', 'docs/**']   # เปิดถ้าไม่ต้อง review docs-only PR

# ⚠️ pull_request_target: ห้าม checkout / รันโค้ดจาก PR เด็ดขาด
# Workflow นี้อ่านแค่ diff ผ่าน API (เป็นข้อมูล ไม่รัน) จึงปลอดภัย

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write   # สร้าง/แก้ไข comment
  contents: read

env:
  AI_REVIEW_MODEL: gpt-4o-mini   # เปลี่ยนเป็นโมเดลอื่นได้ (ถูกและเร็วพอสำหรับ review)

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    continue-on-error: true   # AI ล่ม/rate limit ไม่บล็อก PR
    steps:
      - name: 🤖 AI Review (self-contained)
        uses: actions/github-script@v7   # TODO: pin เป็น 40-char SHA ตาม SECURITY.md
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const MARKER = "<!-- ai-pr-review -->";
            const MAX_DIFF_CHARS = 50000;
            const EXCLUDE = /(pnpm-lock\.yaml|package-lock\.json|yarn\.lock|\.min\.(js|css)|\.map|binary)$/i;

            // ── 1. ดึงไฟล์ที่เปลี่ยน + patch (กรอง lockfile / ไฟล์ใหญ่) ──
            let files = [];
            try {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: pr.number, per_page: 100,
              });
            } catch (e) { core.warning(`listFiles failed: ${e.message}`); }

            const included = files.filter(f => !EXCLUDE.test(f.filename) && f.status !== "removed");
            let diff = "";
            for (const f of included) {
              if (!f.patch) { diff += `\n--- ${f.filename} (binary/too large, skipped) ---\n`; continue; }
              const chunk = `\n--- ${f.filename} (+${f.additions}/-${f.deletions}) ---\n${f.patch}\n`;
              if (diff.length + chunk.length > MAX_DIFF_CHARS) { diff += "\n... [diff ถูกตัดเพราะใหญ่เกินไป] ...\n"; break; }
              diff += chunk;
            }
            const fileList = included.map(f => f.filename).join(", ") || "(no files)";

            // ── 2. เรียก OpenAI ──
            const SYSTEM = `You are a senior code reviewer for an AI video pipeline (Next.js + Python FastAPI + multi-LLM providers).
Review the PR diff focusing ONLY on: correctness bugs, security issues (secrets leakage, injection, auth), performance pitfalls, and broken logic.
IGNORE style/formatting (lint handles it) and nitpicks.
Output in Thai+English mixed, structured as:
### 📝 Summary
### 🔴 Issues (Critical/High) — list with file:line suggestion
### 🟡 Suggestions (Medium)
### ✅ Good points
### ❓ Questions for author
If diff is truncated or unclear, say so and ask for clarification instead of guessing.`;

            let review = "";
            try {
              const res = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${process.env.OPENAI_API_KEY}`,
                },
                body: JSON.stringify({
                  model: process.env.AI_REVIEW_MODEL || "gpt-4o-mini",
                  temperature: 0.2,
                  max_tokens: 1600,
                  messages: [
                    { role: "system", content: SYSTEM },
                    { role: "user", content:
                      `PR #${pr.number}: ${pr.title}\nAuthor: @${pr.user.login}\nBase: ${pr.base.ref} ← ${pr.head.ref}\nFiles (${included.length}): ${fileList}\n\n## DIFF\n${diff}` },
                  ],
                }),
              });
              if (!res.ok) throw new Error(`OpenAI ${res.status}: ${await res.text()}`);
              const data = await res.json();
              review = data.choices?.[0]?.message?.content?.trim() || "(empty response)";
            } catch (e) {
              core.warning(`AI review failed: ${e.message}`);
              review = `⚠️ AI review ไม่สำเร็จในรอบนี้ (${e.message}) — จะลองใหม่ครั้งหน้า`;
            }

            // ── 3. Upsert comment (แก้ไขคอมเมนต์เก่า ไม่สร้างใหม่ทุก push) ──
            const body = `${MARKER}\n## 🤖 AI PR Review (${process.env.AI_REVIEW_MODEL || "gpt-4o-mini"})\n> อัปเดต: ${new Date().toISOString()} • ${included.length} ไฟล์\n\n${review}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number,
            });
            const botComment = comments.find(c =>
              c.user.login === "github-actions[bot]" && c.body?.startsWith(MARKER));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: botComment.id, body,
              });
              core.info("✅ Updated existing AI review comment");
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body,
              });
              core.info("✅ Created AI review comment");
            }
