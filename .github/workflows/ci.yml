
name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Node.js Application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify Runtime
        run: |
          node --version
          npm --version

      - name: Validate Project Files
        run: |
          test -f package.json || {
            echo "::error::package.json not found at repository root"
            exit 1
          }

          test -f package-lock.json || {
            echo "::error::package-lock.json not found at repository root"
            exit 1
          }

          node -e "
            const p = require('./package.json');
            for (const name of ['lint', 'test']) {
              if (!p.scripts || !p.scripts[name]) {
                console.error('Missing npm script:', name);
                process.exitCode = 1;
              }
            }
          "

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Validate JavaScript Syntax
        run: |
          if [ -f index.js ]; then
            node --check index.js
          else
            echo "index.js not found; checking is delegated to lint and tests."
          fi

      - name: Run Test Suite
        run: npm test
