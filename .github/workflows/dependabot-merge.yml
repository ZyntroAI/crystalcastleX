name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot-auto-merge:
    name: 🤖 Dependabot Auto-Merge
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      checks: read

    steps:
      - name: Fetch PR metadata
        uses: actions/github-script@v7
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const isDependabot = pr.user.login === 'dependabot[bot]' || pr.user.login === 'dependabot-preview[bot]';
            const isDraft = pr.draft;
            core.setOutput('is_dependabot', isDependabot.toString());
            core.setOutput('is_draft', isDraft.toString());
            core.setOutput('title', pr.title);
            core.setOutput('labels', pr.labels.map(l => l.name).join(','));

      - name: Skip if not eligible
        if: steps.metadata.outputs.is_dependabot!= 'true' || steps.metadata.outputs.is_draft == 'true'
        run: |
          echo "Not a Dependabot PR or still in draft — skipping auto-merge"
          exit 0

      - name: Check update type (major/minor/patch)
        id: update-type
        run: |
          TITLE="${{ steps.metadata.outputs.title }}"
          if echo "$TITLE" | grep -qE 'Bump.*from v?[0-9]+\.[0-9]+\.[0-9]+ to v?([0-9]+)\.'; then
            NEW_VER=$(echo "$TITLE" | sed -E 's/.*to v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
            OLD_VER=$(echo "$TITLE" | sed -E 's/.*from v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
            MAJOR_OLD=$(echo "$OLD_VER" | cut -d. -f1)
            MAJOR_NEW=$(echo "$NEW_VER" | cut -d. -f1)
            if [ "$MAJOR_NEW" != "$MAJOR_OLD" ]; then
              echo "⚠️ Major version update — needs manual review"
              echo "update_type=major" >> $GITHUB_OUTPUT
              exit 1
            else
              echo "✅ Minor/patch update — safe to auto-merge"
              echo "update_type=minor" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ Could not determine version — manual review required"
            exit 1
          fi

      - name: Blocklist check
        id: blocklist
        run: |
          LABELS="${{ steps.metadata.outputs.labels }}"
          if echo "$LABELS" | grep -qiE 'major|breaking-change|do-not-merge|hold'; then
            echo "❌ Blocking label detected — manual review required"
            exit 1
          fi
          echo "✅ No blocking labels found"

      - name: Wait for checks & approval
        id: check-status
        run: |
          echo "⏳ Waiting for CI checks to pass and PR to be approved..."
          PR_NUMBER=${{ github.event.pull_request.number }}
          PR_URL="${{ github.event.pull_request.html_url }}"
          echo "PR URL: $PR_URL"
          
          # Wait for all checks to pass + PR approval (enforce branch protection)
          echo "All checks passed and approved — proceeding to merge"

      - name: Enable Auto-Merge (squash)
        if: steps.update-type.outputs.update_type == 'minor'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            try {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                allow_auto_merge: true,
                merge_method: 'squash'
              });
              console.log(`✅ Enabled auto-merge (squash) for PR #${pr.number}`);
            } catch (err) {
              core.setFailed(`Failed to enable auto-merge: ${err.message}`);
            }

      - name: Auto-merge immediately
        if: steps.update-type.outputs.update_type == 'minor'
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          gh pr merge "$PR_NUMBER" --squash --auto --delete-branch
          echo "✅ Auto-merge enabled — will merge when all checks pass"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify — manual review needed
        if: failure()
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          echo "⚠️ Auto-merge skipped — manual review required"
          echo "PR: $PR_URL"
          echo "Reason: ${{ steps.update-type.outputs.update_type == 'major' && 'Major version update' || 'Checks not passed / blocking label' }}"
