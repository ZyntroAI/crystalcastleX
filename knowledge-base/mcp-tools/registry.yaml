# MCP & AI Tools Registry — crystalcastleX
# Source of truth for knowledge-base/mcp-tools in ZyntroAI/crystalcastleX.
# Aligned with the OWASP LLM Top 10 and the AST security tiering model (T1–T4).
# T1 = public read · T2 = internal read · T3 = write/execute · T4 = admin/security
#
# NOTE: entries mirror category-*.md exactly (20 rows, 5 categories).
# GitHub Copilot appears in both Marketing and Development, matching the catalog tables.

version: '1.0'
updated: '2026-09-11'
reference:
- OWASP LLM Top 10
- AST Security Tiering (T1–T4)
- MCP Protocol
tiers:
  T1:
    name: Public read
    risk: low
    description: อ่านข้อมูลสาธารณะ ไม่แตะข้อมูลภายใน
  T2:
    name: Internal read
    risk: medium
    description: อ่านข้อมูลภายในองค์กร / เรียกโมเดล
  T3:
    name: Write / Execute
    risk: high
    description: เขียนข้อมูลหรือรันคำสั่งในระบบ
  T4:
    name: Admin / Security
    risk: critical
    description: จัดการสิทธิ์ ความปลอดภัย และขอบเขตการเข้าถึง
