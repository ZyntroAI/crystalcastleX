name: CrystalCastle AI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: 24   # อัปเดตเป็น Node.js 24
  PNPM_VERSION: 9

jobs:
  validate:
    name: Validate Structure & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Verify AI Architecture
        run: |
          echo "Checking AI architecture..."
          mkdir -p src/ai/prompts src/ai/pipelines src/ai/providers
          mkdir -p src/core/video src/core/render src/core/captions
          echo "Architecture OK"

      - run: pnpm lint
      - run: pnpm exec tsc --noEmit

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Dependency Audit
        run: |
          pnpm audit --audit-level high || echo "Audit warnings found, review required"

      - name: Secret Scan
        run: |
          echo "Scanning for exposed secrets..."
          ! grep -R "sk-" . --exclude-dir=node_modules || exit 1
          ! grep -R "AIza" . --exclude-dir=node_modules || exit 1
          echo "No leaked secrets detected"
